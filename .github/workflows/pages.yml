# Publish site/ to GitHub Pages.
#
# site/ rather than docs/ on purpose: docs/ is this project's research record --
# ~40 markdown files of measurements, corrections and retractions written for
# whoever picks the work up. Pages would turn every one of them into a public
# page, which is not what they are for. The site is a separate, small thing that
# points at the repository for the detail.
name: pages

on:
  push:
    # Deploys only from main, so the published page always matches what was
    # merged. Use the manual trigger to preview a branch before then.
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # checkout@v5 runs on Node 24. v4 is a Node 20 action, which the runners
      # now warn is deprecated.
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on if it is off, instead of failing with
          # "Get Pages site failed ... Not Found". Without this the workflow
          # depends on someone having clicked through repository settings
          # first, which is a step a fork has no way to know about.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
