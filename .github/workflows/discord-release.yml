# Each cleared firmware: a GitHub release and its announcement in Discord's #announcements.
#
# Claude publishes a cleared build (CLAUDE.md, "Every cleared build is published"), then
# commits its announcement as releases/vX.Y.md on main (a new file there is the trigger: the
# session's git route cannot push tags). This job, for each releases/v*.md the push added:
#   1. makes the GitHub release vX.Y (and its tag, on that commit), its notes that file (no firmware is attached: the .syx
#      stays on the builds branch, and players build it with the patcher from their own
#      Elektron files);
#   2. posts the same notes to #announcements through the webhook in the repository secret
#      DISCORD_WEBHOOK_URL, as "De-Pattern".
# Both happen here because a release made with the workflow's own token does not start
# other workflows. A release made by hand (the GitHub page) is announced by the second job.
# Re-announce one: Actions > this workflow > Run workflow, with its tag.
name: Release and announce

on:
  push:
    branches: [main]
    paths: ['releases/v*.md']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to announce again (its releases/VERSION.md, e.g. v0.31)"
        required: true

permissions:
  contents: write

jobs:
  from-file:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The announcements this push added
        id: list
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "files=releases/${{ github.event.inputs.tag }}.md" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="${{ github.sha }}~1"; fi
            F=$(git diff --name-only --diff-filter=A "$BEFORE" "${{ github.sha }}" -- 'releases/v*.md' | tr '\n' ' ')
            echo "files=$F" >> "$GITHUB_OUTPUT"
          fi
      - name: Release and announce each
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FILES: ${{ steps.list.outputs.files }}
          EVENT: ${{ github.event_name }}
        run: |
          for F in $FILES; do
            test -f "$F" || { echo "::error::$F is missing"; exit 1; }
            TAG=$(basename "$F" .md)
            # the first line, "# TITLE", is the release's name; the rest its notes
            head -1 "$F" | sed 's/^# *//' > title.txt
            tail -n +2 "$F" | sed '1{/^$/d}' > body.md
            if [ "$EVENT" = "push" ]; then
              if gh release view "$TAG" >/dev/null 2>&1; then
                echo "$TAG: released already"
              else
                gh release create "$TAG" --target "${{ github.sha }}" --title "$(cat title.txt)" --notes-file body.md
              fi
            fi
            if [ -z "$WEBHOOK" ]; then echo "::warning::DISCORD_WEBHOOK_URL is not set: $TAG not announced"; continue; fi
            jq -n --rawfile t title.txt --rawfile b body.md '{
              username: "De-Pattern",
              allowed_mentions: {parse: []},
              embeds: [{
                title: ($t | rtrimstr("\n")),
                description: ($b[0:4000] + (if ($b|length) > 4000 then "\n\n…the rest on GitHub" else "" end)),
                color: 15105570,
                footer: {text: "DN2 mk2 mod · unofficial, not made or supported by Elektron"}
              }]
            }' | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK"
          done

  # a release published by hand on GitHub (not by the job above)
  from-release:
    if: github.event_name == 'release' && github.event.release.author.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Post to #announcements
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NAME: ${{ github.event.release.name }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "::warning::DISCORD_WEBHOOK_URL is not set: not announced"; exit 0; fi
          jq -n --arg n "${NAME:-$TAG}" --arg b "$BODY" '{
            username: "De-Pattern",
            allowed_mentions: {parse: []},
            embeds: [{
              title: $n,
              description: ($b[0:4000] + (if ($b|length) > 4000 then "\n\n…the rest on GitHub" else "" end)),
              color: 15105570,
              footer: {text: "DN2 mk2 mod · unofficial, not made or supported by Elektron"}
            }]
          }' | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK"
